[project]
name = "jirafa"
version = "0.1.0"
description = "Terminal assistant that answers natural-language questions about your Jira tickets"
readme = "README.md"
authors = [
    { name = "fabianfalon", email = "fabian.falon@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.19",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic,bedrock,google,openai]>=2.67.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
jirafa = "jirafa:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # async test functions just work, no decorator needed

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, imports, pyupgrade, bugbear

[tool.mypy]
strict = true            # the strictest checks: every function typed, no implicit Any...
packages = ["jirafa"]
mypy_path = "src"
